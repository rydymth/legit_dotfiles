# --- shell & terminal ---
set -g default-shell /usr/bin/zsh
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # truecolor, for nvim themes
set -g escape-time 0                               # no lag on Esc (important for nvim)
set -g focus-events on                             # nvim autoread on focus
set -g set-clipboard on                            # copy to Windows clipboard via OSC52

# --- sanity ---
set -g mouse on
set -g history-limit 50000
set -g base-index 1                                # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- prefix: Ctrl+a instead of Ctrl+b ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- splits keep the current directory ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# --- vim-style pane movement ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- vi keys in copy mode ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- reload config ---
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# --- status bar ---
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-left "#[bold]#S  "
set -g status-right "%H:%M"

# --- vim-tmux-navigator ---
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind C-l send-keys C-l
